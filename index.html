<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARDÍRA</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #e11d48;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 15px;
      font-size: 0.9rem;
    }

    nav a:hover {
      color: var(--text-color);
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 15px;
      border-left: 4px solid var(--accent-color);
      padding-left: 10px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #334155;
    }

    .card-content {
      padding: 10px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .loading-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VARDÍRA</div>
    <nav>
      <a href="#">Movies</a>
      <a href="#">Series</a>
      <a href="#">Comics</a>
    </nav>
  </header>

  <section class="hero">
    <h1>YOUR NEXT WORLD AWAITS.</h1>
    <p>Discover movies, series, manga, webtoons, and graphic novels curated for you.</p>
  </section>

  <main>
    <h2 class="section-title">Featured Content</h2>
    <div id="media-container" class="media-grid">
      <p class="loading-text">Loading catalog from database...</p>
    </div>
  </main>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Main Integration Script -->
  <script>
    const SUPABASE_URL = 'https://qmtxnbbmrozxjbuubpfr.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_jiq3gl_0SGsgP5PYXPx50w_N7jfSEcR';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadMedia() {
      const container = document.getElementById('media-container');

      const { data: mediaItems, error } = await supabase
        .from('media')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching data from Supabase:', error);
        container.innerHTML = '<p class="loading-text">Failed to load content. Check back shortly!</p>';
        return;
      }

      if (!mediaItems || mediaItems.length === 0) {
        container.innerHTML = '<p class="loading-text">No media available yet.</p>';
        return;
      }

      container.innerHTML = mediaItems.map(item => `
        <div class="card">
          <img src="${item.cover_url || 'https://via.placeholder.com/300x450/1e293b/ffffff?text=No+Cover'}" alt="${item.title}">
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-category">${item.category}</div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadMedia);
  </script>

</body>
</html>
