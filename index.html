<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARDÍRA — Entertainment Discovery</title>
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: #121824;
      --card-hover: #1b2436;
      --accent-color: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.25);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    @media(min-width: 600px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent-color);
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .search-bar {
      position: relative;
      width: 100%;
      max-width: 280px;
    }

    .search-bar input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 15px;
      border-radius: 20px;
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .filter-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 25px;
      scrollbar-width: none;
    }

    .filter-nav::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text-color);
      border-color: var(--text-muted);
    }

    .filter-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(244, 63, 94, 0.4);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
    }

    .card-img-wrapper {
      position: relative;
      height: 220px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #1e293b;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(7, 9, 14, 0.85);
      border: 1px solid var(--border-color);
      color: #fbbf24;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    .card-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-category {
      font-size: 0.7rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .card-action {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--text-color);
      text-align: center;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: 6px;
      transition: all 0.2s;
    }

    .card-action:hover {
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Modal Popup Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 25px var(--accent-glow);
      transform: scale(0.95);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      position: relative;
      height: 260px;
    }

    .modal-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: var(--accent-color);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .modal-meta {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
    }

    .affiliate-btn {
      display: block;
      width: 100%;
      background: var(--accent-color);
      color: #fff;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 10px;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: opacity 0.2s;
    }

    .affiliate-btn:hover {
      opacity: 0.9;
    }

    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VARDÍRA</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search titles..." oninput="handleSearch()">
    </div>
  </header>

  <section class="hero">
    <h1>YOUR NEXT WORLD AWAITS</h1>
    <p>Explore curated cinema, television, and webtoons.</p>
  </section>

  <div class="filter-nav">
    <button class="filter-btn active" onclick="filterCatalog('all', this)">All</button>
    <button class="filter-btn" onclick="filterCatalog('Movies', this)">Movies</button>
    <button class="filter-btn" onclick="filterCatalog('Series', this)">Series</button>
    <button class="filter-btn" onclick="filterCatalog('Comics', this)">Comics & Webtoons</button>
  </div>

  <main>
    <div id="media-container" class="media-grid">
      <div class="loading-state">Loading universes...</div>
    </div>
  </main>

  <!-- Detailed Modal Popup -->
  <div id="mediaModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <img id="modalImg" src="" alt="">
      </div>
      <div class="modal-body">
        <div id="modalCategory" class="modal-category"></div>
        <div id="modalTitle" class="modal-title"></div>
        <div class="modal-meta">
          <span id="modalRating">★ 0.0</span>
        </div>
        <div id="modalDesc" class="modal-desc"></div>
        <a id="modalAffiliateLink" href="#" target="_blank" class="affiliate-btn">Stream / Read on Official Platform</a>
      </div>
    </div>
  </div>

  <script>
    let masterCatalog = [];

    async function loadAllContent() {
      const container = document.getElementById('media-container');

      try {
        // 1. Fetch TV Series from TVMaze
        const tvPromise = fetch('https://api.tvmaze.com/shows')
          .then(res => res.json())
          .then(data => data.slice(0, 18).map(show => ({
            title: show.name,
            category: 'Series',
            rating: show.rating && show.rating.average ? show.rating.average : '7.5',
            cover_url: show.image ? show.image.original || show.image.medium : 'https://via.placeholder.com/210x295/121824/f8fafc?text=No+Cover',
            summary: show.summary ? show.summary.replace(/<[^>]*>?/gm, '') : 'No description available for this series.',
            link: show.url || '#'
          })))
          .catch(() => []);

        // 2. Curated Movies
        const extraMovies = [
          { title: "Midnight Echoes", category: "Movies", rating: "8.4", cover_url: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800&auto=format&fit=crop&q=80", summary: "A dark atmospheric thriller following a mysterious investigation in a neon-lit metropolis.", link: "#" },
          { title: "Crimson Veil", category: "Movies", rating: "8.1", cover_url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=80", summary: "An intense romantic drama exploring forbidden alliances and dark secrets.", link: "#" },
          { title: "Neon Syndicate", category: "Movies", rating: "7.9", cover_url: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80", summary: "In a futuristic underworld, a rogue crew plans a dangerous heist against all odds.", link: "#" }
        ];

        // 3. Fetch Comics & Webtoons from AniList API[span_0](start_span)[span_0](end_span)
        const anilistQuery = `
          query {
            Page(page: 1, perPage: 18) {
              media(type: MANGA, sort: TRENDING_DESC) {
                title { english romaji }
                coverImage { extraLarge large }
                averageScore
                description
                siteUrl
              }
            }
          }
        `;
        const comicsPromise = fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query: anilistQuery })
        })
        .then(res => res.json())
        .then(res => {
          if (!res.data || !res.data.Page) return [];
          return res.data.Page.media.map(m => ({
            title: m.title.english || m.title.romaji || 'Untitled',
            category: 'Comics',
            rating: m.averageScore ? (m.averageScore / 10).toFixed(1) : '8.0',
            cover_url: m.coverImage ? (m.coverImage.extraLarge || m.coverImage.large) : 'https://via.placeholder.com/210x295/121824/f8fafc?text=No+Cover',
            summary: m.description ? m.description.replace(/<[^>]*>?/gm, '') : 'No description available for this webtoon.',
            link: m.siteUrl || '#'
          }));
        })
        .catch(() => []);

        const [shows, comics] = await Promise.all([tvPromise, comicsPromise]);
        
        masterCatalog = [...extraMovies, ...shows, ...comics];

        if (masterCatalog.length === 0) {
          container.innerHTML = '<div class="loading-state">Failed to load content.</div>';
          return;
        }

        renderGrid(masterCatalog);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="loading-state">Error initializing platform.</div>';
      }
    }

    function renderGrid(items) {
      const container = document.getElementById('media-container');
      if (items.length === 0) {
        container.innerHTML = '<div class="loading-state">No matching titles found.</div>';
        return;
      }

      container.innerHTML = items.map((item, index) => `
        <div class="card">
          <div class="card-img-wrapper">
            <img src="${item.cover_url}" alt="${item.title}" loading="lazy">
            <div class="card-badge">★ ${item.rating}</div>
          </div>
          <div class="card-content">
            <div>
              <div class="card-category">${item.category}</div>
              <div class="card-title" title="${item.title}">${item.title}</div>
            </div>
            <button class="card-action" onclick="openModal(${index})">Explore</button>
          </div>
        </div>
      `).join('');
    }

    function openModal(index) {
      const item = masterCatalog[index];
      if (!item) return;

      document.getElementById('modalImg').src = item.cover_url;
      document.getElementById('modalCategory').innerText = item.category;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalRating').innerText = `★ ${item.rating} / 10`;
      document.getElementById('modalDesc').innerText = item.summary;
      document.getElementById('modalAffiliateLink').href = item.link;

      document.getElementById('mediaModal').classList.add('active');
    }

    function closeModal(event) {
      document.getElementById('mediaModal').classList.remove('active');
    }

    function filterCatalog(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').value = '';

      if (category === 'all') {
        renderGrid(masterCatalog);
      } else {
        const filtered = masterCatalog.filter(i => i.category === category);
        renderGrid(filtered);
      }
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

      const filtered = masterCatalog.filter(item => 
        item.title.toLowerCase().includes(query) || item.category.toLowerCase().includes(query)
      );
      renderGrid(filtered);
    }

    document.addEventListener('DOMContentLoaded', loadAllContent);
  </script>

</body>
</html>
