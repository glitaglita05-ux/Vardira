<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARDÍRA - Your Next World Awaits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">VARDÍRA</div>
    <nav class="nav-links">
      <a href="#movies">Movies</a>
      <a href="#series">Series</a>
      <a href="#comics">Comics</a>
      <a href="#reviews">Reviews</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>YOUR NEXT WORLD AWAITS.</h1>
      <p>Discover movies, series, manga, webtoons, and graphic novels curated for you.</p>
    </section>

    <section id="movies" class="content-section">
      <h2>Movies</h2>
      <div class="grid-placeholder">
        <div class="card">Movie 1</div>
        <div class="card">Movie 2</div>
        <div class="card">Movie 3</div>
      </div>
    </section>

    <section id="series" class="content-section">
      <h2>Series</h2>
      <div class="grid-placeholder">
        <div class="card">Series 1</div>
        <div class="card">Series 2</div>
        <div class="card">Series 3</div>
      </div>
    </section>

    <section id="comics" class="content-section">
      <h2>Comics & Webtoons</h2>
      <div class="grid-placeholder">
        <div class="card">Manga</div>
        <div class="card">Webtoon</div>
        <div class="card">Manhwa</div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 VARDÍRA. All rights reserved.</p>
  </footer>
</body>
</html>
