<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARDÍRA — Entertainment & Drama Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo" onclick="showCatalogView()">VARDÍRA</div>
    <div class="search-bar" id="searchBarContainer">
      <input type="text" id="searchInput" placeholder="Search titles..." oninput="handleSearch()">
    </div>
  </header>

  <!-- CATALOG VIEW -->
  <div id="catalog-view">
    <section class="hero">
      <h1>YOUR NEXT WORLD AWAITS</h1>
      <p>Track, review, and explore cinema, television, and dark webtoons.</p>
    </section>

    <div class="filter-nav">
      <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
      <button class="filter-btn" onclick="filterCategory('Movies', this)">Movies</button>
      <button class="filter-btn" onclick="filterCategory('Series', this)">Series</button>
      <button class="filter-btn" onclick="filterCategory('Comics', this)">Comics & Webtoons</button>
      <button class="filter-btn" onclick="filterCategory('Watching', this)">Watching / Reading</button>
      <button class="filter-btn" onclick="filterCategory('Completed', this)">Completed</button>
    </div>

    <main>
      <div id="media-container" class="media-grid">
        <div class="loading-state">Loading universes...</div>
      </div>
    </main>
  </div>

  <!-- DETAIL VIEW (WITH TRACKER & REVIEWS / SPOILER TAGS) -->
  <div id="detail-view">
    <button class="back-btn" onclick="showCatalogView()">← Back to Catalog</button>
    
    <div class="detail-container">
      <div class="detail-img-col">
        <img id="detailImg" src="" alt="">
      </div>
      <div class="detail-info-col">
        <div>
          <div id="detailCategory" class="detail-category"></div>
          <div id="detailTitle" class="detail-title"></div>
          <div id="detailRating" class="detail-rating" style="margin-top: 10px;">★ 0.0</div>
          <p id="detailDesc" class="detail-desc" style="margin-top: 15px;"></p>
        </div>

        <!-- MDL Tracker Status Box -->
        <div class="tracker-box">
          <div class="tracker-label">My Watch / Read Status</div>
          <select id="statusSelect" class="tracker-select" onchange="updateTitleStatus()">
            <option value="">(Not in list)</option>
            <option value="Watching">Watching / Reading</option>
            <option value="Completed">Completed</option>
            <option value="Plan to Watch">Plan to Watch / Read</option>
            <option value="On-Hold">On-Hold</option>
            <option value="Dropped">Dropped</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Community Reviews & Spoiler Section -->
    <div class="reviews-section">
      <h3>Community Reviews & Thoughts</h3>
      
      <div class="review-form">
        <textarea id="reviewInput" placeholder="Share your thoughts... (Type your review here)"></textarea>
        <div class="review-form-controls">
          <label class="spoiler-checkbox-label">
            <input type="checkbox" id="spoilerCheck"> Contains Spoilers ⚠️
          </label>
          <button class="submit-review-btn" onclick="submitReview()">Post Review</button>
        </div>
      </div>

      <div id="reviewsContainer" class="reviews-list">
        <!-- Reviews will appear here -->
      </div>
    </div>
  </div>

  <!-- Script Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
